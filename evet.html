  <title>22-6-17-12 | 22-6-27-12-28-18-21-25-16 | 28-1-9-16-25-21</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 18px 20px 24px;
      overflow-x: hidden; overflow-y: auto; isolation: isolate;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #702d4b;
      background:
        radial-gradient(circle at 15% 18%, rgba(255,255,255,.95), transparent 28%),
        radial-gradient(circle at 85% 78%, rgba(255,190,215,.65), transparent 30%),
        linear-gradient(135deg, #fff0f5, #ffd9e8 55%, #ffeaf1);
    }
    .glow {
      position: fixed; inset: -25%; z-index: -2; pointer-events: none;
      background: conic-gradient(from 0deg, transparent, rgba(255,255,255,.52), transparent 30%, rgba(255,178,207,.2), transparent 65%);
      filter: blur(35px); animation: glow-turn 24s linear infinite;
    }
    main {
      position: relative; z-index: 2; width: min(760px, 100%); text-align: center;
      padding: 8px 0 16px;
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .photo-frame {
      position: relative; padding: 9px; border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,205,225,.8));
      box-shadow: 0 25px 80px rgba(112,45,75,.2), 0 0 0 1px rgba(255,255,255,.75);
      animation: photo-glow 3.8s ease-in-out infinite;
    }
    /* Bu sahne fotoğrafın kendi gerçek sınırlarına göre ölçülenir. */
    .photo-stage {
      position: relative; display: inline-block; vertical-align: top;
      max-width: 100%; margin: 0 auto; border-radius: 22px; isolation: isolate;
    }
    .photo-reveal {
      position: absolute; inset: 0; z-index: 1;
      display: grid; place-items: center; overflow: hidden; border-radius: 22px;
      color: #fff8f1; text-align: center; opacity: 1;
      background: #241a25;
      transition: background .5s ease;
    }
    .location-coordinates {
      display: grid; gap: 9px; padding: 12px;
      font: 700 clamp(1rem, 3.1vw, 1.55rem)/1.35 "Courier New", monospace;
      letter-spacing: .025em; color: #fff8f1;
      text-shadow: 0 0 18px rgba(255,159,194,.28);
      text-align: center;
    }
    .photo-stage img {
      position: relative; z-index: 2; display: block;
      width: auto; height: auto; max-width: 100%;
      max-height: min(50vh, 520px); object-fit: contain;
      border-radius: 22px; transform-origin: 100% 0%;
      animation: photo-in 1.15s .08s cubic-bezier(.2,.8,.2,1) both;
      will-change: transform, opacity, filter, clip-path;
      transition: transform .12s linear, clip-path .12s linear, filter .12s linear;
    }
    /* Fotoğrafın basılı yüzü, parmağın hareketiyle birlikte yapışkanlı kâğıt gibi kalkar. */
    .peel-flap {
      position: absolute; z-index: 4; inset: 0; pointer-events: none;
      background-image: url("https://yagmurasigim.wordpress.com/wp-content/uploads/2026/11/evet-surprizi.png");
      background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
      clip-path: polygon(calc(100% - var(--peel-x, 0%)) 0, 100% 0, 100% var(--peel-y, 0%));
      transform-origin: 100% 0%; opacity: 0;
      filter: drop-shadow(-10px 12px 11px rgba(48,19,34,.42));
      will-change: transform, clip-path, opacity;
      backface-visibility: hidden;
    }
    .peel-flap::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(140deg, transparent 25%, rgba(255,255,255,.08) 42%, rgba(255,255,255,.72) 50%, rgba(112,53,78,.26) 57%, transparent 69%);
      opacity: .8;
    }
    .photo-stage.is-dragging .peel-flap { opacity: 1; }
    .photo-stage.is-dragging .couple-photo {
      clip-path: polygon(0 0, calc(100% - var(--peel-x, 0%)) 0, 100% var(--peel-y, 0%), 100% 100%, 0 100%);
      transform: perspective(1500px)
        translate3d(var(--sheet-x, 0px), var(--sheet-y, 0px), 0)
        rotateX(var(--sheet-rx, 0deg)) rotateY(var(--sheet-ry, 0deg))
        rotateZ(var(--sheet-rz, 0deg)) scale(var(--sheet-scale, 1));
      filter: drop-shadow(-8px 12px 12px rgba(58,25,42,.28));
      transition: none;
    }
    .peel-handle {
      position: absolute; z-index: 10; top: 0; right: 0;
      display: block; width: clamp(64px, 14vw, 96px);
      height: clamp(64px, 14vw, 96px); min-width: 0; min-height: 0;
      padding: 0; margin: 0; border: 0; border-radius: 0;
      appearance: none; -webkit-appearance: none;
      cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
      pointer-events: auto; clip-path: polygon(0 0, 100% 0, 100% 100%);
      background: linear-gradient(145deg, rgba(255,255,255,.98) 0%, #fffafd 43%, #d7a8ba 72%, #9f617b 100%);
      filter: drop-shadow(-6px 8px 7px rgba(48,19,34,.34));
      transform-origin: 100% 0%; transition: transform .18s ease, opacity .35s ease;
      box-shadow: none; outline: none;
    }
    .peel-handle::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(140deg, transparent 38%, rgba(153,82,111,.24) 47%, rgba(255,255,255,.94) 52%, rgba(255,255,255,.14) 59%, transparent 68%);
    }
    .peel-handle::after {
      content: ""; position: absolute; right: 8%; top: 8%;
      width: 26%; height: 26%; border-top: 1px solid rgba(255,255,255,.95);
      border-right: 1px solid rgba(255,255,255,.95); border-radius: 0 9px 0 0;
      opacity: .8;
    }
    .peel-handle:focus-visible { outline: 3px solid #b94b79; outline-offset: -5px; }
    .peel-handle.dragging { cursor: grabbing; transition: none; }
    .photo-stage.is-peeled .couple-photo {
      clip-path: none !important;
      transform: perspective(1500px) translate3d(225px, 285px, 72px)
        rotateX(27deg) rotateY(-38deg) rotateZ(15deg) scale(.82) !important;
      opacity: 0; filter: drop-shadow(-20px 28px 18px rgba(55,24,42,0)) !important;
      transition:
        transform 1.18s cubic-bezier(.18,.72,.2,1),
        opacity .92s ease .18s,
        filter 1.05s ease;
      pointer-events: none;
    }
    .photo-stage.is-peeled .peel-flap {
      opacity: 0;
      transform: perspective(1100px) translate3d(190px,235px,55px)
        rotateX(-48deg) rotateY(30deg) rotateZ(48deg);
      transition: transform 1.02s cubic-bezier(.18,.68,.2,1), opacity .72s ease .16s;
    }
    .photo-stage.is-peeled .peel-handle {
      opacity: 0; transform: translate3d(180px,225px,50px) rotateZ(48deg) rotateY(-35deg);
      transition: transform .95s cubic-bezier(.18,.68,.2,1), opacity .7s ease .12s;
      pointer-events: none;
    }
    .photo-stage.is-peeled .photo-reveal { background: #241a25; }
    .love-counter {
      width: min(620px, 100%); margin: 20px auto 0; padding: 17px 18px 19px;
      border: 1px solid rgba(255,255,255,.8); border-radius: 22px;
      background: rgba(255,255,255,.62); backdrop-filter: blur(12px);
      box-shadow: 0 12px 36px rgba(112,45,75,.09);
      animation: arrive 1s .25s both;
    }
    .counter-title {
      margin: 0 0 13px; color: #a13f68; font-size: .9rem; font-weight: 700;
      letter-spacing: .04em;
    }
    .counter-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
    }
    .counter-unit {
      padding: 10px 5px 9px; border-radius: 14px;
      background: rgba(255,239,246,.88); border: 1px solid rgba(212,119,157,.13);
    }
    .counter-value {
      display: block; color: #873653; font-size: clamp(1.25rem, 4vw, 1.9rem);
      line-height: 1.15; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .counter-label {
      display: block; margin-top: 5px; color: #b36a87; font-size: .72rem;
      font-weight: 650; letter-spacing: .04em;
    }
    .apology {
      margin: 11px 0 0; color: #aa6b84; font-size: .82rem; font-weight: 500;
      letter-spacing: .01em; opacity: .9;
    }
    a {
      display: inline-block; margin-top: 22px; padding: 11px 19px; border-radius: 999px;
      color: #a13f68; text-decoration: none; font-weight: 650;
      background: rgba(255,255,255,.62); border: 1px solid rgba(177,79,119,.16);
      box-shadow: 0 8px 24px rgba(112,45,75,.08);
      transition: transform .2s ease, background .2s ease;
    }
    a:hover { transform: translateY(-3px); background: white; }
    #heart-layer { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
    .heart {
      position: absolute; left: var(--x); top: var(--y); color: var(--color);
      font-size: var(--size); line-height: 1; opacity: 0;
      text-shadow: 0 5px 18px rgba(183,69,118,.18);
      animation: heart-rise var(--duration) var(--delay) ease-out forwards;
      will-change: transform, opacity;
    }
    .heart.burst { animation-name: heart-burst; }
    .sparkle {
      position: absolute; left: var(--x); top: var(--y); color: white;
      font-size: var(--size); opacity: 0;
      text-shadow: 0 0 12px #e77da5;
      animation: sparkle-pop 1.5s var(--delay) ease-out forwards;
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes photo-in {
      from { opacity: 0; transform: scale(.94); filter: blur(8px); }
      to { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    @keyframes unused-legacy-sticker-peel {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @keyframes photo-glow {
      0%, 100% { box-shadow: 0 25px 80px rgba(112,45,75,.2), 0 0 0 1px rgba(255,255,255,.75); }
      50% { box-shadow: 0 28px 88px rgba(196,77,127,.28), 0 0 30px rgba(255,255,255,.8); }
    }
    @keyframes glow-turn { to { transform: rotate(360deg); } }
    @keyframes heart-rise {
      0% { opacity: 0; transform: translate3d(0, 20px, 0) rotate(-12deg) scale(.65); }
      12% { opacity: .82; }
      75% { opacity: .72; }
      100% { opacity: 0; transform: translate3d(var(--drift), -115vh, 0) rotate(var(--spin)) scale(1.2); }
    }
    @keyframes heart-burst {
      0% { opacity: 0; transform: translate3d(0,0,0) scale(.25) rotate(0); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--dx), var(--dy), 0) scale(var(--end-scale)) rotate(var(--spin)); }
    }
    @keyframes sparkle-pop {
      0%, 100% { opacity: 0; transform: scale(.2) rotate(0); }
      35% { opacity: .95; transform: scale(1.2) rotate(45deg); }
      70% { opacity: .5; transform: scale(.7) rotate(90deg); }
    }
    @media (max-width: 520px) {
      body { padding: 14px; }
      .photo-frame { padding: 6px; border-radius: 23px; }
      .photo-stage, .photo-reveal, .photo-stage img { border-radius: 18px; }
      .photo-stage img { max-height: 42vh; }
      .location-coordinates { gap: 7px; font-size: clamp(.85rem, 4vw, 1.2rem); }
      .peel-handle { width: 72px; height: 72px; }
      a { margin-top: 16px; }
      .love-counter { margin-top: 14px; padding: 13px 10px 14px; border-radius: 18px; }
      .counter-grid { gap: 6px; }
      .counter-unit { padding: 9px 2px 8px; border-radius: 11px; }
      .counter-label { font-size: .64rem; letter-spacing: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>

<body>
  <div class="glow" aria-hidden="true"></div>
  <div id="heart-layer" aria-hidden="true"></div>
  <main>
    <div class="photo-frame" id="photo-frame">
      <div class="photo-stage" id="photo-stage">
        <div class="photo-reveal" aria-live="polite">
          <div class="location-coordinates">
            <span>37°03'48.5"N</span>
            <span>37°21'41.0"E</span>
          </div>
        </div>
        <img class="couple-photo" id="couple-photo" src="https://yagmurasigim.wordpress.com/wp-content/uploads/2026/11/evet-surprizi.png" alt="Düğün kıyafetleriyle poz veren çift">
        <div class="peel-flap" aria-hidden="true"></div>
        <button class="peel-handle" id="peel-handle" type="button" aria-label="Fotoğrafın sağ üst köşesini sağ alta doğru çek"></button>
      </div>
    </div>
    <section class="love-counter" aria-label="29 Eylül'den beri geçen süre">
      <p class="counter-title">Birlikte geçen zaman</p>
      <div class="counter-grid" role="timer" aria-live="off">
        <div class="counter-unit"><span class="counter-value" id="days">0</span><span class="counter-label">GÜN</span></div>
        <div class="counter-unit"><span class="counter-value" id="hours">00</span><span class="counter-label">SAAT</span></div>
        <div class="counter-unit"><span class="counter-value" id="minutes">00</span><span class="counter-label">DAKİKA</span></div>
        <div class="counter-unit"><span class="counter-value" id="seconds">00</span><span class="counter-label">SANİYE</span></div>
      </div>
    </section>
    <p class="apology">Bu kadar beklettiğim için üzgünüm.</p>
    <a href="soru.html">Başa dön</a>
  </main>
  <script>
    const layer = document.getElementById('heart-layer');
    const photoStage = document.getElementById('photo-stage');
    const peelHandle = document.getElementById('peel-handle');
    let peelStart = null;
    let peelComplete = false;
    const colors = ['#e84f87', '#f27eaa', '#d94f83', '#f6a4c2', '#c94e7a', '#ffffff'];

    // Köşe, parmak/fare hareketine birebir bağlanır; bırakınca soyulma tamamlanır.
    peelHandle.addEventListener('pointerdown', (event) => {
      if (peelComplete || peelStart) return;
      event.preventDefault();
      peelStart = { id: event.pointerId, x: event.clientX, y: event.clientY, progress: 0 };
      peelHandle.classList.add('dragging');
      photoStage.classList.add('is-dragging');
      try { peelHandle.setPointerCapture(event.pointerId); } catch (error) {}
    });

    function movePeel(event) {
      if (!peelStart || event.pointerId !== peelStart.id || peelComplete) return;

      // Down-right travel sets the peel distance continuously; no sudden threshold jump.
      const dx = Math.max(0, event.clientX - peelStart.x);
      const dy = Math.max(0, event.clientY - peelStart.y);
      const distance = Math.hypot(dx, dy);
      const progress = Math.min(.96, distance / 245);
      peelStart.progress = progress;

      const peelX = Math.min(66, progress * 70 + dx / 11);
      const peelY = Math.min(72, progress * 76 + dy / 13);
      photoStage.style.setProperty('--peel-x', peelX.toFixed(2) + '%');
      photoStage.style.setProperty('--peel-y', peelY.toFixed(2) + '%');

      // The full photo sheet lifts progressively; the peeled corner curls above it.
      const sheetX = dx * .24 + progress * 20;
      const sheetY = dy * .29 + progress * 28;
      const tiltX = Math.min(18, dy * .045);
      const tiltY = Math.min(24, dx * .055);
      const rotation = Math.min(8, progress * 8);
      photoStage.style.setProperty('--sheet-x', sheetX.toFixed(1) + 'px');
      photoStage.style.setProperty('--sheet-y', sheetY.toFixed(1) + 'px');
      photoStage.style.setProperty('--sheet-rx', (-tiltX).toFixed(2) + 'deg');
      photoStage.style.setProperty('--sheet-ry', (-tiltY).toFixed(2) + 'deg');
      photoStage.style.setProperty('--sheet-rz', rotation.toFixed(2) + 'deg');
      photoStage.style.setProperty('--sheet-scale', (1 - progress * .035).toFixed(3));

      const flap = photoStage.querySelector('.peel-flap');
      const flapX = dx * .44 + progress * 16;
      const flapY = dy * .48 + progress * 20;
      const fold = progress * 58;
      if (flap) {
        flap.style.transform =
          'perspective(1100px) translate3d(' + flapX.toFixed(1) + 'px,' +
          flapY.toFixed(1) + 'px,28px) rotateX(' + (-fold * .7).toFixed(2) +
          'deg) rotateY(' + (fold * .48).toFixed(2) + 'deg) rotateZ(' +
          (progress * 22).toFixed(2) + 'deg)';
      }
      peelHandle.style.transform =
        'perspective(900px) translate3d(' + (dx * .48).toFixed(1) + 'px,' +
        (dy * .5).toFixed(1) + 'px,34px) rotateX(' + (-fold * .45).toFixed(2) +
        'deg) rotateZ(' + (progress * 38).toFixed(2) + 'deg)';
    }

    function resetPeel() {
      peelStart = null;
      peelHandle.classList.remove('dragging');
      photoStage.classList.remove('is-dragging');
      photoStage.style.removeProperty('--peel-x');
      photoStage.style.removeProperty('--peel-y');
      photoStage.style.removeProperty('--sheet-x');
      photoStage.style.removeProperty('--sheet-y');
      photoStage.style.removeProperty('--sheet-rx');
      photoStage.style.removeProperty('--sheet-ry');
      photoStage.style.removeProperty('--sheet-rz');
      photoStage.style.removeProperty('--sheet-scale');
      const flap = photoStage.querySelector('.peel-flap');
      if (flap) flap.style.transform = '';
      peelHandle.style.transform = '';
    }

    function completePeel() {
      if (peelComplete) return;
      peelComplete = true;
      peelStart = null;
      photoStage.classList.remove('is-dragging');
      photoStage.classList.add('is-peeled');
      peelHandle.classList.remove('dragging');
      peelHandle.disabled = true;
      peelHandle.setAttribute('aria-hidden', 'true');
    }

    function finishPeel(event) {
      if (!peelStart || event.pointerId !== peelStart.id || peelComplete) return;
      movePeel(event);
      const progress = peelStart ? peelStart.progress : 0;
      if (progress >= .12) completePeel();
      else resetPeel();
    }

    window.addEventListener('pointermove', movePeel, { passive: true });
    window.addEventListener('pointerup', finishPeel);
    window.addEventListener('pointercancel', resetPeel);
    peelHandle.addEventListener('lostpointercapture', () => {
      if (peelStart && !peelComplete) resetPeel();
    });

    // Keyboard fallback: activate the sticker peel with Enter or Space.
    peelHandle.addEventListener('click', (event) => {
      if (event.detail === 0 && !peelComplete) completePeel();
    });

    // Başlangıç: 29 Eylül 2026, İstanbul yerel saatiyle 00:00.
    const startDate = new Date('2026-09-29T00:00:00+03:00');
    const counterNodes = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };

    function updateLoveCounter() {
      const elapsedSeconds = Math.max(0, Math.floor((Date.now() - startDate.getTime()) / 1000));
      const days = Math.floor(elapsedSeconds / 86400);
      const hours = Math.floor((elapsedSeconds % 86400) / 3600);
      const minutes = Math.floor((elapsedSeconds % 3600) / 60);
      const seconds = elapsedSeconds % 60;

      counterNodes.days.textContent = days.toLocaleString('tr-TR');
      counterNodes.hours.textContent = String(hours).padStart(2, '0');
      counterNodes.minutes.textContent = String(minutes).padStart(2, '0');
      counterNodes.seconds.textContent = String(seconds).padStart(2, '0');
    }

    updateLoveCounter();
    setInterval(updateLoveCounter, 1000);
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function addHeart({ x, y, burst = false }) {
      const heart = document.createElement('span');
      heart.className = burst ? 'heart burst' : 'heart';
      heart.textContent = Math.random() > .18 ? '♥' : '♡';
      heart.style.setProperty('--x', x + 'vw');
      heart.style.setProperty('--y', y + 'vh');
      heart.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
      heart.style.setProperty('--size', (burst ? 15 + Math.random() * 27 : 12 + Math.random() * 19) + 'px');
      heart.style.setProperty('--delay', (Math.random() * (burst ? .22 : 1.8)) + 's');
      heart.style.setProperty('--duration', (burst ? 1.5 + Math.random() * 1.1 : 5.5 + Math.random() * 5) + 's');
      heart.style.setProperty('--drift', (-65 + Math.random() * 130) + 'px');
      heart.style.setProperty('--spin', (-55 + Math.random() * 110) + 'deg');
      heart.style.setProperty('--dx', (-window.innerWidth * .48 + Math.random() * window.innerWidth * .96) + 'px');
      heart.style.setProperty('--dy', (-window.innerHeight * .25 + Math.random() * window.innerHeight * .5) + 'px');
      heart.style.setProperty('--end-scale', (.65 + Math.random() * 1.25).toFixed(2));
      layer.appendChild(heart);
      heart.addEventListener('animationend', () => heart.remove(), { once: true });
    }

    function addSparkle() {
      const sparkle = document.createElement('span');
      sparkle.className = 'sparkle';
      sparkle.textContent = '✦';
      sparkle.style.setProperty('--x', (5 + Math.random() * 90) + 'vw');
      sparkle.style.setProperty('--y', (5 + Math.random() * 90) + 'vh');
      sparkle.style.setProperty('--size', (9 + Math.random() * 13) + 'px');
      sparkle.style.setProperty('--delay', (Math.random() * .7) + 's');
      layer.appendChild(sparkle);
      sparkle.addEventListener('animationend', () => sparkle.remove(), { once: true });
    }

    if (!reducedMotion) {
      // Evet sayfası açıldığında ortadan dışarı doğru kalp patlaması.
      for (let i = 0; i < 42; i++) {
        addHeart({ x: 50 + (Math.random() * 10 - 5), y: 52 + (Math.random() * 10 - 5), burst: true });
      }
      for (let i = 0; i < 18; i++) addSparkle();

      // Sonrasında ekranda usulca süzülen kalpler.
      let ambientCount = 0;
      const ambientTimer = setInterval(() => {
        addHeart({ x: Math.random() * 100, y: 105 + Math.random() * 15 });
        ambientCount++;
        if (ambientCount >= 36) clearInterval(ambientTimer);
      }, 480);
    }
  </script>
</body>

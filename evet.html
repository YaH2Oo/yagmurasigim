<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f5">
  <title>❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      overflow: hidden; isolation: isolate;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #702d4b;
      background:
        radial-gradient(circle at 15% 18%, rgba(255,255,255,.95), transparent 28%),
        radial-gradient(circle at 85% 78%, rgba(255,190,215,.65), transparent 30%),
        linear-gradient(135deg, #fff0f5, #ffd9e8 55%, #ffeaf1);
    }
    .glow {
      position: fixed; inset: -25%; z-index: -2; pointer-events: none;
      background: conic-gradient(from 0deg, transparent, rgba(255,255,255,.52), transparent 30%, rgba(255,178,207,.2), transparent 65%);
      filter: blur(35px); animation: glow-turn 24s linear infinite;
    }
    main {
      position: relative; z-index: 2; width: min(760px, 100%); text-align: center;
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .photo-frame {
      position: relative; padding: 9px; border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,205,225,.8));
      box-shadow: 0 25px 80px rgba(112,45,75,.2), 0 0 0 1px rgba(255,255,255,.75);
      animation: photo-glow 3.8s ease-in-out infinite;
    }
    img {
      display: block; width: 100%; max-height: 72vh; object-fit: contain;
      border-radius: 22px; animation: photo-in 1.15s .08s cubic-bezier(.2,.8,.2,1) both;
    }
    a {
      display: inline-block; margin-top: 22px; padding: 11px 19px; border-radius: 999px;
      color: #a13f68; text-decoration: none; font-weight: 650;
      background: rgba(255,255,255,.62); border: 1px solid rgba(177,79,119,.16);
      box-shadow: 0 8px 24px rgba(112,45,75,.08);
      transition: transform .2s ease, background .2s ease;
    }
    a:hover { transform: translateY(-3px); background: white; }
    #heart-layer { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
    .heart {
      position: absolute; left: var(--x); top: var(--y); color: var(--color);
      font-size: var(--size); line-height: 1; opacity: 0;
      text-shadow: 0 5px 18px rgba(183,69,118,.18);
      animation: heart-rise var(--duration) var(--delay) ease-out forwards;
      will-change: transform, opacity;
    }
    .heart.burst { animation-name: heart-burst; }
    .sparkle {
      position: absolute; left: var(--x); top: var(--y); color: white;
      font-size: var(--size); opacity: 0;
      text-shadow: 0 0 12px #e77da5;
      animation: sparkle-pop 1.5s var(--delay) ease-out forwards;
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes photo-in {
      from { opacity: 0; transform: scale(.94); filter: blur(8px); }
      to { opacity: 1; transform: scale(1); filter: blur(0); }
    }
    @keyframes photo-glow {
      0%, 100% { box-shadow: 0 25px 80px rgba(112,45,75,.2), 0 0 0 1px rgba(255,255,255,.75); }
      50% { box-shadow: 0 28px 88px rgba(196,77,127,.28), 0 0 30px rgba(255,255,255,.8); }
    }
    @keyframes glow-turn { to { transform: rotate(360deg); } }
    @keyframes heart-rise {
      0% { opacity: 0; transform: translate3d(0, 20px, 0) rotate(-12deg) scale(.65); }
      12% { opacity: .82; }
      75% { opacity: .72; }
      100% { opacity: 0; transform: translate3d(var(--drift), -115vh, 0) rotate(var(--spin)) scale(1.2); }
    }
    @keyframes heart-burst {
      0% { opacity: 0; transform: translate3d(0,0,0) scale(.25) rotate(0); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--dx), var(--dy), 0) scale(var(--end-scale)) rotate(var(--spin)); }
    }
    @keyframes sparkle-pop {
      0%, 100% { opacity: 0; transform: scale(.2) rotate(0); }
      35% { opacity: .95; transform: scale(1.2) rotate(45deg); }
      70% { opacity: .5; transform: scale(.7) rotate(90deg); }
    }
    @media (max-width: 520px) {
      body { padding: 14px; }
      .photo-frame { padding: 6px; border-radius: 23px; }
      img { max-height: 69vh; border-radius: 18px; }
      a { margin-top: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div id="heart-layer" aria-hidden="true"></div>
  <main>
    <div class="photo-frame">
      <img src="https://yagmurasigim.wordpress.com/wp-content/uploads/2026/11/evet-surprizi.png" alt="Düğün kıyafetleriyle poz veren çift">
    </div>
    <a href="index.html">Başa dön</a>
  </main>
  <script>
    const layer = document.getElementById('heart-layer');
    const colors = ['#e84f87', '#f27eaa', '#d94f83', '#f6a4c2', '#c94e7a', '#ffffff'];
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function addHeart({ x, y, burst = false }) {
      const heart = document.createElement('span');
      heart.className = burst ? 'heart burst' : 'heart';
      heart.textContent = Math.random() > .18 ? '♥' : '♡';
      heart.style.setProperty('--x', x + 'vw');
      heart.style.setProperty('--y', y + 'vh');
      heart.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
      heart.style.setProperty('--size', (burst ? 15 + Math.random() * 27 : 12 + Math.random() * 19) + 'px');
      heart.style.setProperty('--delay', (Math.random() * (burst ? .22 : 1.8)) + 's');
      heart.style.setProperty('--duration', (burst ? 1.5 + Math.random() * 1.1 : 5.5 + Math.random() * 5) + 's');
      heart.style.setProperty('--drift', (-65 + Math.random() * 130) + 'px');
      heart.style.setProperty('--spin', (-55 + Math.random() * 110) + 'deg');
      heart.style.setProperty('--dx', (-window.innerWidth * .48 + Math.random() * window.innerWidth * .96) + 'px');
      heart.style.setProperty('--dy', (-window.innerHeight * .25 + Math.random() * window.innerHeight * .5) + 'px');
      heart.style.setProperty('--end-scale', (.65 + Math.random() * 1.25).toFixed(2));
      layer.appendChild(heart);
      heart.addEventListener('animationend', () => heart.remove(), { once: true });
    }

    function addSparkle() {
      const sparkle = document.createElement('span');
      sparkle.className = 'sparkle';
      sparkle.textContent = '✦';
      sparkle.style.setProperty('--x', (5 + Math.random() * 90) + 'vw');
      sparkle.style.setProperty('--y', (5 + Math.random() * 90) + 'vh');
      sparkle.style.setProperty('--size', (9 + Math.random() * 13) + 'px');
      sparkle.style.setProperty('--delay', (Math.random() * .7) + 's');
      layer.appendChild(sparkle);
      sparkle.addEventListener('animationend', () => sparkle.remove(), { once: true });
    }

    if (!reducedMotion) {
      // Evet sayfası açıldığında ortadan dışarı doğru kalp patlaması.
      for (let i = 0; i < 42; i++) {
        addHeart({ x: 50 + (Math.random() * 10 - 5), y: 52 + (Math.random() * 10 - 5), burst: true });
      }
      for (let i = 0; i < 18; i++) addSparkle();

      // Sonrasında ekranda usulca süzülen kalpler.
      let ambientCount = 0;
      const ambientTimer = setInterval(() => {
        addHeart({ x: Math.random() * 100, y: 105 + Math.random() * 15 });
        ambientCount++;
        if (ambientCount >= 36) clearInterval(ambientTimer);
      }, 480);
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f5">
  <title>Küçük Bir Sır ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
      padding: 22px; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #702d4b; overflow: hidden;
      background:
        radial-gradient(circle at 16% 16%, rgba(255,255,255,.95), transparent 29%),
        radial-gradient(circle at 85% 82%, rgba(255,190,215,.6), transparent 30%),
        linear-gradient(135deg, #fff0f5, #ffd9e8 55%, #ffeaf1);
    }
    .gate {
      width: min(440px, 100%); padding: clamp(28px, 7vw, 46px);
      text-align: center; border: 1px solid rgba(190,93,130,.18); border-radius: 28px;
      background: rgba(255,255,255,.78); backdrop-filter: blur(12px);
      box-shadow: 0 24px 70px rgba(126,45,78,.14);
      animation: appear .8s cubic-bezier(.2,.8,.2,1) both;
    }
    .lock {
      width: 62px; height: 62px; margin: 0 auto 18px; display: grid; place-items: center;
      border-radius: 50%; color: #c14f7b; font-size: 28px;
      background: #ffe4ee; box-shadow: 0 8px 24px rgba(190,93,130,.13);
    }
    h1 { margin: 0 0 9px; color: #873653; font-size: clamp(1.8rem, 7vw, 2.35rem); }
    .sub { margin: 0 0 25px; color: #aa6b84; font-size: .95rem; }
    label { display: block; text-align: left; margin: 0 0 8px 3px; color: #934560; font-size: .84rem; font-weight: 700; }
    input {
      display: block; width: 100%; height: 52px; padding: 0 16px; outline: none;
      border: 1px solid #edc2d3; border-radius: 14px; background: #fffafd;
      color: #702d4b; font: inherit; text-align: center; letter-spacing: .12em;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: #d96b96; box-shadow: 0 0 0 4px rgba(217,107,150,.13); }
    button {
      width: 100%; margin-top: 14px; min-height: 51px; border: 0; border-radius: 999px;
      color: #fff; background: #d94f83; font: inherit; font-weight: 750; cursor: pointer;
      box-shadow: 0 9px 22px rgba(190,63,112,.2); transition: transform .2s, background .2s;
    }
    button:hover { background: #c83f73; transform: translateY(-2px); }
    #message { min-height: 22px; margin: 14px 0 0; color: #bd4771; font-size: .84rem; }
    @keyframes appear { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="gate">
    <div class="lock" aria-hidden="true">♡</div>
    <h1>Minik bir sır…</h1>
    <p class="sub">Devam etmek için şifreyi gir.</p>
    <form id="gate-form">
      <label for="password">ŞİFRE</label>
      <input id="password" name="password" type="password" placeholder="Şifreyi yaz..." autocomplete="off" autocapitalize="off" spellcheck="false" required autofocus>
      <button type="submit">Giriş yap</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('gate-form');
    const password = document.getElementById('password');
    const message = document.getElementById('message');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const entered = password.value.trim().toLocaleLowerCase('tr-TR');
      if (entered === 'aşk') {
        window.location.href = 'soru.html';
      } else {
        message.textContent = 'Şifre olmadı, bir daha dene. ❤️';
        password.value = '';
        password.focus();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020805">
  <title>?</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
      padding: 22px; overflow: hidden; isolation: isolate;
      background: #020805; color: #b5ffc8;
      font-family: "Courier New", ui-monospace, monospace;
    }
    #matrix {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: -3; opacity: .62; pointer-events: none;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(0,35,13,.1) 0%, rgba(0,0,0,.3) 42%, rgba(0,0,0,.82) 100%),
        linear-gradient(0deg, rgba(0,0,0,.24), rgba(0,18,5,.12));
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: 4; pointer-events: none;
      opacity: .12; mix-blend-mode: screen;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(70,255,120,.12) 4px, transparent 5px);
    }
    .gate {
      width: min(370px, 100%); padding: clamp(27px, 7vw, 40px);
      text-align: center; border: 1px solid rgba(61,255,117,.42); border-radius: 9px;
      background: rgba(0,12,5,.76); backdrop-filter: blur(7px);
      box-shadow: 0 0 18px rgba(0,255,80,.12), inset 0 0 28px rgba(0,255,80,.035);
      animation: appear .9s cubic-bezier(.2,.8,.2,1) both;
    }
    h1 {
      margin: 0 0 22px; color: #75ff9d; font-size: clamp(5rem, 19vw, 7rem);
      line-height: .95; font-weight: 400; text-shadow: 0 0 8px rgba(65,255,121,.9), 0 0 28px rgba(0,255,78,.45);
      animation: pulse 2.8s ease-in-out infinite;
    }
    input {
      display: block; width: 100%; height: 51px; padding: 0 16px; outline: none;
      border: 1px solid rgba(76,255,129,.36); border-radius: 5px;
      background: rgba(0,0,0,.72); color: #9dffb6; caret-color: #74ff98;
      font: inherit; font-size: 1.15rem; text-align: center; letter-spacing: .3em;
      box-shadow: inset 0 0 13px rgba(0,255,77,.06);
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: #65ff92;
      box-shadow: 0 0 0 2px rgba(49,255,106,.12), 0 0 18px rgba(0,255,80,.18), inset 0 0 16px rgba(0,255,77,.08);
    }
    button {
      width: 100%; margin-top: 12px; min-height: 48px; border: 1px solid rgba(95,255,138,.55);
      border-radius: 5px; color: #8dffad; background: rgba(0,45,16,.74);
      font: inherit; font-size: 1.8rem; cursor: pointer;
      text-shadow: 0 0 10px rgba(65,255,121,.7);
      box-shadow: 0 0 13px rgba(0,255,80,.08), inset 0 0 14px rgba(0,255,80,.06);
      transition: background .2s, box-shadow .2s, transform .2s;
    }
    button:hover, button:focus-visible {
      outline: none; background: rgba(0,83,29,.86);
      box-shadow: 0 0 20px rgba(0,255,80,.23), inset 0 0 18px rgba(0,255,80,.1);
    }
    button:active { transform: scale(.985); }
    .gate.wrong { animation: shake .28s linear; border-color: rgba(255,55,75,.85); }
    .gate.wrong input { border-color: rgba(255,55,75,.9); box-shadow: 0 0 14px rgba(255,30,60,.18); }
    .hint {
      margin: 18px 0 0; color: #b5ffc8; font-size: .9rem; line-height: 1.6;
      letter-spacing: .02em; text-shadow: 0 0 12px rgba(65,255,121,.28);
      animation: appear .65s ease both;
    }
    .hint[hidden] { display: none; }

    /* Şifre doğru girilince açılan sinematik geçiş */
    .transition-screen {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
      overflow: hidden; opacity: 0; visibility: hidden; pointer-events: none;
      background: radial-gradient(circle, rgba(0,45,17,.16), rgba(0,0,0,.96) 68%);
    }
    .transition-screen.active {
      visibility: visible; pointer-events: auto;
      animation: screen-arrive 1.85s ease-in-out forwards;
    }
    .transition-screen::before {
      content: ""; position: absolute; width: 12vmin; height: 12vmin; border-radius: 50%;
      background: #baffcb; opacity: 0; filter: blur(14px);
    }
    .transition-screen.active::before { animation: portal-flash 1.55s ease-out .25s both; }
    .transition-content { position: relative; display: grid; justify-items: center; gap: 28px; }
    .portal {
      position: relative; width: clamp(170px, 43vw, 250px); aspect-ratio: 1;
      display: grid; place-items: center; border-radius: 50%;
      filter: drop-shadow(0 0 24px rgba(34,255,105,.24));
    }
    .portal::before, .portal::after, .portal-ring {
      content: ""; position: absolute; inset: 5%; border: 1px solid rgba(94,255,143,.68);
      border-radius: 50%; box-shadow: 0 0 18px rgba(0,255,84,.2), inset 0 0 18px rgba(0,255,84,.12);
    }
    .portal::before { inset: 14%; border-style: dashed; animation: ring-spin 5s linear infinite; }
    .portal::after { inset: 0; border-width: 2px; border-color: rgba(151,255,179,.82); animation: ring-breathe 1.3s ease-in-out infinite; }
    .portal-ring { inset: 24%; border-color: rgba(68,255,125,.42); animation: ring-spin 3.5s linear infinite reverse; }
    .portal-core {
      position: relative; width: 48%; aspect-ratio: 1; display: grid; place-items: center;
      border-radius: 50%; background: radial-gradient(circle, rgba(47,255,117,.2), rgba(0,18,7,.88) 72%);
      box-shadow: 0 0 38px rgba(0,255,90,.22), inset 0 0 24px rgba(0,255,90,.2);
    }
    .portal-core span { position: absolute; line-height: 1; }
    .mark-question { color: #bdffd0; font-size: clamp(4.6rem, 17vw, 6.4rem); animation: question-out .58s ease-in forwards; }
    .mark-heart {
      color: #ff8eae; font-size: clamp(4rem, 15vw, 5.8rem); opacity: 0;
      text-shadow: 0 0 12px rgba(255,91,145,.95), 0 0 34px rgba(255,37,109,.7);
      animation: heart-in .9s cubic-bezier(.18,.9,.25,1.3) .48s forwards, heart-beat 1s ease-in-out 1.35s infinite;
    }
    .transition-caption {
      margin: 0; color: #a8ffc0; font: 600 .78rem/1.4 "Courier New", monospace;
      letter-spacing: .28em; text-align: center; text-shadow: 0 0 15px rgba(43,255,111,.75);
      opacity: 0; animation: caption-in .6s ease .72s forwards;
    }
    .loading-line { width: min(210px, 52vw); height: 2px; overflow: hidden; background: rgba(100,255,145,.16); }
    .loading-line span { display: block; width: 35%; height: 100%; background: #aaffbf; box-shadow: 0 0 12px #39ff75; animation: loading-sweep 1.05s ease-in-out .65s both; }
    body.transitioning #matrix { opacity: .98; }
    body.transitioning .gate { animation: gate-dissolve .55s ease forwards; }
    body.transitioning #matrix { filter: brightness(1.35); }
    @keyframes screen-arrive { 0% { opacity: 0; } 18% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes portal-flash { 0% { opacity: 0; transform: scale(.2); } 35% { opacity: .8; } 100% { opacity: 0; transform: scale(15); } }
    @keyframes ring-spin { to { transform: rotate(360deg); } }
    @keyframes ring-breathe { 0%,100% { transform: scale(.96); opacity: .55; } 50% { transform: scale(1.05); opacity: 1; } }
    @keyframes question-out { 0% { opacity: 1; transform: scale(1) rotate(0); } 100% { opacity: 0; transform: scale(.25) rotate(100deg); } }
    @keyframes heart-in { 0% { opacity: 0; transform: scale(.2); } 65% { opacity: 1; transform: scale(1.22); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes heart-beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @keyframes caption-in { to { opacity: 1; transform: translateY(0); } from { opacity: 0; transform: translateY(8px); } }
    @keyframes loading-sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(310%); } }
    @keyframes gate-dissolve { to { opacity: 0; transform: scale(.84); filter: blur(12px); } }
    @keyframes appear {
      from { opacity: 0; transform: translateY(14px) scale(.97); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .82; text-shadow: 0 0 8px rgba(65,255,121,.75), 0 0 24px rgba(0,255,78,.35); }
      50% { opacity: 1; text-shadow: 0 0 13px rgba(65,255,121,1), 0 0 38px rgba(0,255,78,.65); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-4px); }
    }
    @media (max-width: 480px) {
      .gate { width: min(340px, 100%); padding: 27px 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="transition-screen" id="transition-screen" aria-hidden="true">
    <div class="transition-content">
      <div class="portal" aria-hidden="true">
        <div class="portal-ring"></div>
        <div class="portal-core"><span class="mark-question">?</span><span class="mark-heart">♥</span></div>
      </div>
      <p class="transition-caption">KALBİNE BAĞLANIYOR...</p>
      <div class="loading-line" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <main class="gate" id="gate">
    <h1 aria-label="Soru işareti">?</h1>
    <form id="gate-form">
      <input id="password" name="password" type="password" aria-label="Şifre" autocomplete="off" autocapitalize="off" spellcheck="false" required autofocus>
      <button type="submit" aria-label="Devam et">?</button>
    </form>
    <p class="hint" id="hint" aria-live="polite" hidden>Gözlerine duyduğum ihtiras...</p>
  </main>
  <script>
    const form = document.getElementById('gate-form');
    const password = document.getElementById('password');
    const gate = document.getElementById('gate');
    const hint = document.getElementById('hint');
    const transitionScreen = document.getElementById('transition-screen');
    let wrongAttempts = 0;
    let isTransitioning = false;
    let matrixBoost = 1;

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const entered = password.value.trim().toLocaleLowerCase('tr-TR');
      if (entered === 'aşk') {
        if (isTransitioning) return;
        isTransitioning = true;
        password.disabled = true;
        form.querySelector('button').disabled = true;
        document.body.classList.add('transitioning');
        transitionScreen.classList.add('active');
        transitionScreen.setAttribute('aria-hidden', 'false');
        matrixBoost = 4.2;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.setTimeout(() => { window.location.href = 'soru.html'; }, reducedMotion ? 450 : 1900);
      } else {
        wrongAttempts++;
        if (wrongAttempts >= 3) hint.hidden = false;
        gate.classList.remove('wrong');
        void gate.offsetWidth;
        gate.classList.add('wrong');
        password.value = '';
        password.focus();
      }
    });

    // Matrix-style falling code background.
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    const glyphs = 'アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&*+-<>?';
    const fontSize = 16;
    let columns = [];
    let width = 0;
    let height = 0;

    function resizeMatrix() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      columns = Array.from({ length: Math.ceil(width / fontSize) }, () => Math.random() * (height / fontSize));
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 8, 3, 0.085)';
      ctx.fillRect(0, 0, width, height);
      ctx.font = fontSize + 'px monospace';
      for (let i = 0; i < columns.length; i++) {
        const char = glyphs[Math.floor(Math.random() * glyphs.length)];
        const x = i * fontSize;
        const y = columns[i] * fontSize;
        ctx.fillStyle = Math.random() > .975 ? '#d5ffe0' : '#19d653';
        ctx.fillText(char, x, y);
        if (y > height && Math.random() > .975) columns[i] = 0;
        columns[i] += (.52 + Math.random() * .5) * matrixBoost;
      }
      requestAnimationFrame(drawMatrix);
    }

    resizeMatrix();
    window.addEventListener('resize', resizeMatrix);
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      drawMatrix();
    } else {
      ctx.fillStyle = 'rgba(0, 8, 3, 1)';
      ctx.fillRect(0, 0, width, height);
    }
  </script>
</body>
</html>
